=====================================================================
  ESTOQUE PAULU'S — aplicativo completo em um único arquivo
  Contagem de estoque e controle de validade (celular / leitor de código)

  COMO USAR
  1) Teste agora: abra este arquivo no navegador. Sem configuração ele
     roda em MODO DEMONSTRAÇÃO (dados salvos só no aparelho).
  2) Supabase: crie um projeto, abra SQL Editor > New query e rode o SQL
     que está no bloco <script id="schema-sql"> mais abaixo (ou use o
     botão "Copiar SQL do banco" no menu de conta do app).
     Em Authentication: desative "Allow new users to sign up" e crie
     um usuário (e-mail/senha, Auto Confirm) para cada estoquista.
  3) Cole a Project URL e a anon public key no bloco CONFIGURAÇÃO
     (procure por SUPABASE_URL neste arquivo).
  4) GitHub Pages: envie este arquivo como "index.html" para um
     repositório e ative Settings > Pages (branch main, pasta raiz).
     A câmera só funciona em https:// (o GitHub Pages já é https).
=====================================================================
-->

/* =============================================================
   Estoque Paulu's — estilos (mobile first)
   Cores da marca: #00906d (verde) · #d9d9d9 (cinza) · #efdece (creme)
   ============================================================= */
:root {
  --verde: #00906d;
  --verde-escuro: #007457;
  --verde-claro: #e3f3ee;
  --cinza: #d9d9d9;
  --creme: #efdece;
  --creme-claro: #f8f3ee;
  --fundo: #f8f3ee;
  --cartao: #ffffff;
  --texto: #1d2a25;
  --suave: #5f6b66;
  --borda: #e4dcd3;
  --vencido: #c2410c;
  --vencido-fundo: #fdeae2;
  --alerta: #a16207;
  --alerta-cor: #e5a000;
  --alerta-fundo: #fdf3d8;
  --ok: var(--verde);
  --ok-fundo: var(--verde-claro);
  --raio: 14px;
  --sombra: 0 1px 2px rgba(29, 42, 37, .06), 0 4px 14px rgba(29, 42, 37, .05);
  --abas-h: 68px;
  --seguro-baixo: env(safe-area-inset-bottom, 0px);
  --seguro-topo: env(safe-area-inset-top, 0px);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--texto);
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fundo);
  min-height: 100dvh;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body.sem-rolagem { overflow: hidden; }
a { color: var(--verde); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
button, input, select { font: inherit; color: inherit; }
code { background: var(--creme); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.25em; }
.texto-suave { color: var(--suave); margin: 0; }
[hidden] { display: none !important; }

/* ---------- Abertura / carregando ---------- */
.abertura { min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 24px; }
.girador {
  width: 22px; height: 22px; border-radius: 50%; display: inline-block;
  border: 3px solid var(--cinza); border-top-color: var(--verde);
  animation: girar .8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }
.carregando { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 32px; color: var(--suave); }

/* ---------- Topo ---------- */
.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + var(--seguro-topo)) 16px 10px;
  background: var(--verde); color: #fff;
}
.topo__marca { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; margin-right: auto; }
.topo__logo { height: 34px; width: auto; }
.topo__marca span { display: flex; flex-direction: column; line-height: 1.1; }
.topo__marca strong { font-size: 1.1rem; letter-spacing: .2px; }
.topo__marca small { font-size: .75rem; opacity: .85; }
.topo__menu {
  width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: rgba(255, 255, 255, .15); color: #fff; display: grid; place-items: center; cursor: pointer;
}
.selo-demo {
  font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  background: var(--creme); color: var(--verde-escuro); padding: 4px 8px; border-radius: 99px;
}

/* ---------- Conteúdo ---------- */
.conteudo {
  max-width: 640px; margin: 0 auto;
  padding: 16px 16px calc(var(--abas-h) + var(--seguro-baixo) + 28px);
  display: flex; flex-direction: column; gap: 16px;
  outline: none;
}
.titulo-tela h1 { font-size: 1.45rem; }
.titulo-tela p { margin: 4px 0 0; color: var(--suave); }
.titulo-tela--acoes { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

/* ---------- Abas inferiores ---------- */
.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--abas-h) + var(--seguro-baixo)); padding-bottom: var(--seguro-baixo);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: #fff; border-top: 1px solid var(--borda);
  box-shadow: 0 -4px 16px rgba(29, 42, 37, .05);
}
.abas a {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: .7rem; font-weight: 600; color: #7d8783; text-decoration: none; padding: 8px 0;
}
.abas a .ic { width: 24px; height: 24px; }
.abas a.ativa { color: var(--verde); }
.abas__bipar { position: relative; top: -14px; }
.abas__bipar span {
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  background: var(--verde); color: #fff; box-shadow: 0 6px 16px rgba(0, 144, 109, .38);
  border: 4px solid var(--fundo);
}
.abas__bipar span .ic { width: 28px; height: 28px; }
.abas__bipar em { font-style: normal; margin-top: 2px; }
.abas__bipar.ativa span { background: var(--verde-escuro); }

/* ---------- Cartões e seções ---------- */
.cartao {
  background: var(--cartao); border-radius: var(--raio); padding: 16px;
  box-shadow: var(--sombra); border: 1px solid var(--borda);
}
.secao { display: flex; flex-direction: column; gap: 10px; }
.secao__cab { display: flex; justify-content: space-between; align-items: baseline; }
.secao__cab h2 { font-size: 1.05rem; }
.secao__cab a { font-weight: 600; text-decoration: none; font-size: .9rem; }
.secao__cab small { color: var(--suave); }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 650; font-size: 1rem; text-decoration: none; cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .6; pointer-events: none; }
.btn--primario { background: var(--verde); color: #fff; }
.btn--primario:hover { background: var(--verde-escuro); }
.btn--escuro { background: var(--texto); color: #fff; }
.btn--claro { background: #fff; color: var(--texto); border-color: var(--cinza); }
.btn--perigo { background: var(--vencido); color: #fff; }
.btn--perigo-texto { background: transparent; color: var(--vencido); }
.btn--grande { min-height: 54px; font-size: 1.05rem; }
.btn--pequeno { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
.btn--bloco { width: 100%; }
.btn-icone {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  border: 1px solid var(--cinza); background: #fff; color: var(--texto); cursor: pointer; text-decoration: none;
}
.link-acao {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0;
  color: var(--verde); font-weight: 600; text-decoration: none; cursor: pointer; text-align: left;
}

/* ---------- Formulários ---------- */
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.campo > span { font-size: .88rem; font-weight: 600; color: var(--suave); }
.campo em { font-weight: 400; font-style: normal; }
input, select {
  width: 100%; min-height: 48px; padding: 10px 14px; font-size: 1rem;
  border: 1.5px solid var(--cinza); border-radius: 12px; background: #fff;
  outline: none; transition: border-color .15s;
}
input:focus, select:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0, 144, 109, .15); }
input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 50px; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--verde); }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grade-2 .campo { margin-bottom: 14px; }
.erro-form {
  margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--vencido-fundo); color: var(--vencido); font-weight: 600; font-size: .92rem;
}
.acoes-form { display: flex; gap: 10px; margin-top: 6px; }
.acoes-form .btn { flex: 1; }
.acoes-form .btn--claro { flex: 0 0 auto; }
hr { border: 0; border-top: 1px dashed var(--borda); margin: 6px 0 16px; }

.form-linha { display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; }
.form-linha .campo { flex: 1; margin: 0; }
.form-linha .btn { min-height: 50px; }

.alerta-dias { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.alerta-dias input { width: 86px; text-align: center; font-weight: 700; font-size: 1.1rem; }

/* ---------- Chips ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips--rolagem { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.chips--rolagem::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 6px 14px; border-radius: 99px; cursor: pointer;
  border: 1.5px solid var(--cinza); background: #fff; font-weight: 600; font-size: .9rem; white-space: nowrap;
}
.chip b { margin-left: 4px; font-weight: 700; color: var(--suave); }
.chip.ativo { background: var(--verde); border-color: var(--verde); color: #fff; }
.chip.ativo b { color: #fff; }
.chip--vencido.ativo { background: var(--vencido); border-color: var(--vencido); }
.chip--alerta.ativo { background: var(--alerta-cor); border-color: var(--alerta-cor); color: #3a2a00; }
.chip--alerta.ativo b { color: #3a2a00; }

/* ---------- Bipar ---------- */
.bipar { display: flex; flex-direction: column; gap: 12px; }
.bipar__titulo { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--verde-escuro); }
.separador { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: .8rem; }
.separador::before, .separador::after { content: ""; flex: 1; border-top: 1px solid var(--borda); }
.linha-codigo { display: flex; gap: 8px; }
.linha-codigo input { font-size: 1.15rem; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.linha-codigo .btn { width: 54px; padding: 0; flex: none; }

/* ---------- Produto (cabeçalho) ---------- */
.produto-cab { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.produto-cab__icone {
  width: 48px; height: 48px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--creme); color: var(--verde-escuro);
}
.produto-cab__icone .ic { width: 26px; height: 26px; }
.produto-cab__info { flex: 1; min-width: 0; }
.produto-cab__info h3 { font-size: 1.1rem; }
.produto-cab__info p { margin: 2px 0 0; color: var(--suave); font-size: .85rem; overflow-wrap: anywhere; }
.produto-cab__meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px !important; color: var(--texto) !important; }

.form-entrada__titulo { font-size: 1rem; margin: 4px 0 12px; color: var(--verde-escuro); }

/* Contador de quantidade */
.contador { display: flex; align-items: stretch; gap: 8px; }
.contador input { text-align: center; font-size: 1.5rem; font-weight: 700; min-height: 58px; flex: 1; min-width: 0; }
.contador__btn {
  width: 58px; flex: none; border-radius: 12px; border: 1.5px solid var(--cinza); background: var(--creme-claro);
  display: grid; place-items: center; cursor: pointer; color: var(--verde-escuro);
}
.contador__btn .ic { width: 24px; height: 24px; }
.contador__un { align-self: center; font-weight: 700; color: var(--suave); min-width: 28px; }
.previa-validade { margin: -6px 0 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 1px; }
.previa-validade small { color: var(--vencido); font-weight: 600; }

/* ---------- Selos de situação ---------- */
.selo {
  display: inline-block; padding: 3px 9px; border-radius: 99px;
  font-size: .78rem; font-weight: 700; white-space: nowrap;
}
.selo--vencido { background: var(--vencido-fundo); color: var(--vencido); }
.selo--alerta { background: var(--alerta-fundo); color: var(--alerta); }
.selo--ok { background: var(--ok-fundo); color: var(--verde-escuro); }

/* ---------- Avisos ---------- */
.aviso {
  display: flex; gap: 10px; padding: 12px; border-radius: 12px; margin-bottom: 14px;
  background: var(--creme); color: var(--texto); font-size: .92rem;
}
.aviso p { margin: 2px 0 0; }
.aviso .ic { margin-top: 2px; }
.aviso--info { background: var(--verde-claro); }
.aviso--info .ic { color: var(--verde); }
.aviso--alerta { background: var(--alerta-fundo); }
.aviso--alerta .ic { color: var(--alerta); }

/* ---------- Listas ---------- */
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  position: relative; width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: #fff; border: 1px solid var(--borda); border-radius: 12px;
  text-align: left; text-decoration: none; color: var(--texto); cursor: pointer; overflow: hidden;
  font-size: 1rem;
}
li.item { cursor: default; }
.item__barra { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: transparent; }
.item--vencido .item__barra { background: var(--vencido); }
.item--alerta .item__barra { background: var(--alerta-cor); }
.item--ok .item__barra { background: var(--verde); }
.item--zerado { opacity: .6; }
.item__principal { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item__principal strong { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item__principal small { color: var(--suave); font-size: .82rem; }
.item__lado { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: var(--suave); }
.item__qtd b { font-size: 1.15rem; color: var(--texto); }
.item__qtd small { font-size: .78rem; }
.diferenca small { font-size: .8rem; }
.diferenca em { font-style: normal; font-weight: 700; font-size: .85rem; }
.diferenca--igual em { color: var(--verde); }
.diferenca--falta em { color: var(--vencido); }
.diferenca--sobra em { color: var(--alerta); }

.vazio {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 22px 16px; color: var(--suave); background: rgba(255, 255, 255, .55);
  border: 1.5px dashed var(--borda); border-radius: 12px; list-style: none;
}
.vazio .ic { width: 28px; height: 28px; color: var(--verde); }
.vazio p { margin: 0; }

/* ---------- Início ---------- */
.saudacao p { margin: 0; color: var(--suave); font-weight: 600; }
.saudacao h1 { font-size: 1.4rem; margin-top: 2px; }
.indicadores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.indicador {
  display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: var(--raio);
  background: #fff; border: 1px solid var(--borda); text-decoration: none; color: var(--texto); box-shadow: var(--sombra);
}
.indicador strong { font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.indicador span { font-size: .85rem; color: var(--suave); }
.indicador--vencido { background: var(--vencido-fundo); border-color: #f6cdb9; }
.indicador--vencido strong { color: var(--vencido); }
.indicador--alerta { background: var(--alerta-fundo); border-color: #f3dc9a; }
.indicador--alerta strong { color: var(--alerta); }

.acoes-rapidas { display: grid; gap: 10px; }
.acao-rapida {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--raio);
  background: var(--creme); color: var(--texto); text-decoration: none;
}
.acao-rapida .ic { width: 30px; height: 30px; color: var(--verde-escuro); }
.acao-rapida span { display: flex; flex-direction: column; }
.acao-rapida small { color: var(--suave); }
.acao-rapida--principal { background: var(--verde); color: #fff; box-shadow: 0 6px 18px rgba(0, 144, 109, .25); }
.acao-rapida--principal .ic { color: #fff; }
.acao-rapida--principal small { color: rgba(255, 255, 255, .85); }

/* ---------- Contagem ---------- */
.progresso__texto { display: flex; gap: 6px; align-items: baseline; margin-bottom: 10px; }
.progresso__texto span { margin-left: auto; font-weight: 700; color: var(--verde); }
.progresso__barra { height: 10px; border-radius: 99px; background: var(--creme); overflow: hidden; }
.progresso__barra span { display: block; height: 100%; background: var(--verde); border-radius: 99px; transition: width .4s ease; }

.lotes-contagem { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.lote-cont {
  display: flex; gap: 12px; align-items: center; padding: 12px;
  border-radius: 12px; border: 1px solid var(--borda); border-left: 5px solid var(--verde); background: var(--creme-claro);
}
.lote-cont--vencido { border-left-color: var(--vencido); }
.lote-cont--alerta { border-left-color: var(--alerta-cor); }
.lote-cont__info { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.lote-cont__info small { color: var(--suave); }
.lote-cont__campo { width: 108px; flex: none; display: flex; flex-direction: column; gap: 4px; }
.lote-cont__campo span { font-size: .78rem; font-weight: 600; color: var(--suave); }
.lote-cont__campo input { text-align: center; font-size: 1.2rem; font-weight: 700; }

.dobra summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 4px 0; }
.dobra summary::-webkit-details-marker { display: none; }
.dobra summary h2 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.dobra summary::after { content: "▾"; color: var(--suave); margin-left: 8px; transition: transform .2s; }
.dobra[open] summary::after { transform: rotate(180deg); }
.dobra summary small { margin-left: auto; background: var(--creme); padding: 2px 10px; border-radius: 99px; font-weight: 700; }
.dobra[open] > :not(summary) { margin-top: 12px; }

/* ---------- Busca / alternar ---------- */
.busca {
  display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--cinza);
  border-radius: 12px; padding: 0 12px; color: var(--suave);
}
.busca:focus-within { border-color: var(--verde); }
.busca input { border: 0; padding-left: 0; box-shadow: none !important; }
.alternar { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--suave); }

.voltar { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; text-decoration: none; }

/* ---------- Folha inferior ---------- */
.folha-fundo {
  position: fixed; inset: 0; z-index: 50; background: rgba(20, 30, 26, .45);
  display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s;
}
.folha-fundo.aberta { opacity: 1; }
.folha {
  width: 100%; max-width: 640px; max-height: 90dvh; overflow-y: auto;
  background: #fff; border-radius: 20px 20px 0 0; padding: 8px 18px calc(20px + var(--seguro-baixo));
  transform: translateY(30px); transition: transform .22s ease;
  display: flex; flex-direction: column; gap: 12px;
}
.folha-fundo.aberta .folha { transform: none; }
.folha__pegador { width: 44px; height: 5px; border-radius: 99px; background: var(--cinza); margin: 4px auto 6px; }
.folha__titulo { font-size: 1.2rem; }
.acoes-folha { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.acoes-folha .btn { flex: 1; }
.detalhes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--creme-claro); border-radius: 12px; padding: 12px; }
.detalhes div { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.detalhes span { font-size: .78rem; color: var(--suave); }
.detalhes__largo { grid-column: 1 / -1; }
.detalhes strong { overflow-wrap: anywhere; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; top: calc(var(--seguro-topo) + 70px); z-index: 60;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none;
  width: max-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 12px;
  background: var(--texto); color: #fff; padding: 12px 16px; border-radius: 12px;
  font-weight: 600; font-size: .95rem; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
  transition: opacity .2s, transform .2s;
}
.toast.visivel { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast--ok { background: var(--verde-escuro); }
.toast--erro { background: var(--vencido); }
.toast button { background: none; border: 0; color: var(--creme); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* ---------- Câmera ---------- */
.camera {
  position: fixed; inset: 0; z-index: 70; background: #000; color: #fff;
  display: flex; flex-direction: column;
}
.camera__topo {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + var(--seguro-topo)) 16px 14px; font-weight: 600;
}
.camera__fechar {
  width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 1.2rem;
  background: rgba(255, 255, 255, .18); color: #fff; cursor: pointer;
}
.camera__video { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.camera__video video { width: 100% !important; height: auto !important; max-height: 100%; object-fit: cover; }
.camera__rodape { padding: 16px 16px calc(20px + var(--seguro-baixo)); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.camera__dica { margin: 0; opacity: .8; font-size: .9rem; }
.camera__lanterna.ativo { background: var(--creme); }

/* ---------- Login ---------- */
.login {
  min-height: 100dvh; max-width: 420px; margin: 0 auto; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
}
.login__logo { height: 110px; width: auto; }
.login h1 { font-size: 1.8rem; color: var(--verde-escuro); }
.login h1 span { color: var(--texto); }
.login__form { width: 100%; text-align: left; margin-top: 10px; }

.erro-geral { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px 16px; }
.erro-geral .ic { width: 36px; height: 36px; color: var(--vencido); }
.erro-geral small { color: var(--suave); overflow-wrap: anywhere; }

/* ---------- Telas maiores (computador / tablet) ---------- */
@media (min-width: 720px) {
  .indicadores { grid-template-columns: repeat(4, 1fr); }
  .acoes-rapidas { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 360px) {
  .grade-2 { grid-template-columns: 1fr; }
  .lote-cont__campo { width: 92px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation-duration: 0s !important; }
}

/* Ajuste: chips de alerta numa linha só */
.alerta-dias .chips { flex-wrap: nowrap; }
.alerta-dias .chip { padding: 6px 11px; }

.sql-caixa { width: 100%; min-height: 50dvh; font: 12px/1.4 ui-monospace, monospace; border: 1.5px solid var(--cinza); border-radius: 12px; padding: 10px; }

  </style>
</head>

-- ---------- PRODUTOS ----------
-- Cada produto tem o seu próprio prazo de alerta (dias_alerta),
-- definido pelo estoquista no cadastro.
create table if not exists public.produtos (
  id             uuid primary key default gen_random_uuid(),
  codigo_barras  text not null unique,
  nome           text not null,
  unidade        text not null default 'un',
  categoria      text,
  dias_alerta    integer not null default 7 check (dias_alerta >= 0),
  ativo          boolean not null default true,
  criado_em      timestamptz not null default now(),
  atualizado_em  timestamptz not null default now()
);

-- ---------- LOTES (cada entrada/recebimento) ----------
-- Um lote = uma chegada de produto com quantidade e validade.
-- "quantidade" é o saldo atual do lote (ajustado pelas contagens).
create table if not exists public.lotes (
  id                   uuid primary key default gen_random_uuid(),
  produto_id           uuid not null references public.produtos(id) on delete cascade,
  quantidade           numeric(12,3) not null check (quantidade >= 0),
  quantidade_recebida  numeric(12,3) not null check (quantidade_recebida >= 0),
  validade             date not null,
  observacao           text,
  recebido_em          timestamptz not null default now(),
  recebido_por         text default (auth.jwt() ->> 'email')
);
create index if not exists lotes_produto_idx  on public.lotes (produto_id);
create index if not exists lotes_validade_idx on public.lotes (validade) where quantidade > 0;

-- ---------- CONTAGENS (histórico de inventário) ----------
create table if not exists public.contagens (
  id                   uuid primary key default gen_random_uuid(),
  lote_id              uuid references public.lotes(id) on delete set null,
  produto_id           uuid not null references public.produtos(id) on delete cascade,
  quantidade_anterior  numeric(12,3) not null,
  quantidade_contada   numeric(12,3) not null check (quantidade_contada >= 0),
  contado_em           timestamptz not null default now(),
  contado_por          text default (auth.jwt() ->> 'email')
);
create index if not exists contagens_produto_idx on public.contagens (produto_id);
create index if not exists contagens_data_idx    on public.contagens (contado_em desc);

-- ---------- Atualiza "atualizado_em" automaticamente ----------
create or replace function public.tg_set_atualizado_em()
returns trigger language plpgsql as $$
begin
  new.atualizado_em := now();
  return new;
end $$;

drop trigger if exists produtos_atualizado_em on public.produtos;
create trigger produtos_atualizado_em
  before update on public.produtos
  for each row execute function public.tg_set_atualizado_em();

-- ---------- Segurança (RLS) ----------
-- Só usuários logados (criados em Authentication > Users) acessam os dados.
alter table public.produtos  enable row level security;
alter table public.lotes     enable row level security;
alter table public.contagens enable row level security;

drop policy if exists "logados_tudo_produtos"  on public.produtos;
drop policy if exists "logados_tudo_lotes"     on public.lotes;
drop policy if exists "logados_tudo_contagens" on public.contagens;

create policy "logados_tudo_produtos"  on public.produtos
  for all to authenticated using (true) with check (true);
create policy "logados_tudo_lotes"     on public.lotes
  for all to authenticated using (true) with check (true);
create policy "logados_tudo_contagens" on public.contagens
  for all to authenticated using (true) with check (true);

-- ---------- Tempo real (atualiza todos os celulares ao mesmo tempo) ----------
do $$
begin
  begin alter publication supabase_realtime add table public.produtos;  exception when others then null; end;
  begin alter publication supabase_realtime add table public.lotes;     exception when others then null; end;
  begin alter publication supabase_realtime add table public.contagens; exception when others then null; end;
end $$;

  </script>

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => [...raiz.querySelectorAll(sel)];

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// ---------- Números e datas ----------
function lerNumero(v) {
  if (typeof v === "number") return v;
  let s = String(v ?? "").trim();
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); // 1.234,5 -> 1234.5
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function fmtQtd(n) {
  return Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
}

function hojeStr() {
  return new Date().toLocaleDateString("sv-SE");
}

function inicioDoDiaISO() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

function fmtData(aaaaMmDd) {
  if (!aaaaMmDd) return "—";
  const [a, m, d] = aaaaMmDd.slice(0, 10).split("-");
  return `${d}/${m}/${a}`;
}

function fmtDataHora(iso) {
  const d = new Date(iso);
  const hoje = new Date();
  const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === hoje.toDateString()) return `hoje, ${hora}`;
  const ontem = new Date(Date.now() - 864e5);
  if (d.toDateString() === ontem.toDateString()) return `ontem, ${hora}`;
  return `${d.toLocaleDateString("pt-BR")} ${hora}`;
}

function utc(aaaaMmDd) {
  const [a, m, d] = aaaaMmDd.slice(0, 10).split("-").map(Number);
  return Date.UTC(a, m - 1, d);
}

function diasAte(validade) {
  return Math.round((utc(validade) - utc(hojeStr())) / 864e5);
}

const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

/** Situação de um lote conforme o alerta do produto. */
function situacao(validade, diasAlerta) {
  const dias = diasAte(validade);
  if (dias < 0) return { tipo: "vencido", dias, texto: `Vencido há ${plural(-dias, "dia", "dias")}`, curto: "Vencido" };
  if (dias === 0) return { tipo: "alerta", dias, texto: "Vence hoje", curto: "Hoje" };
  if (dias <= Number(diasAlerta)) return { tipo: "alerta", dias, texto: `Vence em ${plural(dias, "dia", "dias")}`, curto: `${dias}d` };
  return { tipo: "ok", dias, texto: `Vence em ${plural(dias, "dia", "dias")}`, curto: `${dias}d` };
}

// ---------- Toast ----------
let toastTimer;
function toast(msg, tipo = "ok", acao) {
  let el = $("#toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  el.className = `toast toast--${tipo} visivel`;
  el._em = Date.now();
  el.innerHTML = `<span>${esc(msg)}</span>${acao ? `<button type="button">${esc(acao.rotulo)}</button>` : ""}`;
  if (acao) el.querySelector("button").onclick = () => { el.classList.remove("visivel"); acao.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("visivel"), acao ? 6000 : 3200);
}

// ---------- Folha inferior (bottom sheet) ----------
function abrirFolha(html, aoMontar) {
  fecharFolha();
  const fundo = document.createElement("div");
  fundo.className = "folha-fundo";
  fundo.innerHTML = `<div class="folha" role="dialog" aria-modal="true"><div class="folha__pegador"></div>${html}</div>`;
  fundo.addEventListener("click", (e) => e.target === fundo && fecharFolha());
  document.body.appendChild(fundo);
  document.body.classList.add("sem-rolagem");
  requestAnimationFrame(() => fundo.classList.add("aberta"));
  aoMontar?.(fundo.querySelector(".folha"));
}
function fecharFolha() {
  $$(".folha-fundo").forEach((f) => f.remove());
  document.body.classList.remove("sem-rolagem");
}

function confirmar({ titulo, texto, botao = "Confirmar", perigo = false }) {
  return new Promise((resolve) => {
    abrirFolha(
      `<h2 class="folha__titulo">${esc(titulo)}</h2>
       <p class="texto-suave">${esc(texto)}</p>
       <div class="acoes-folha">
         <button type="button" class="btn btn--claro" data-r="0">Cancelar</button>
         <button type="button" class="btn ${perigo ? "btn--perigo" : "btn--primario"}" data-r="1">${esc(botao)}</button>
       </div>`,
      (f) => f.querySelectorAll("[data-r]").forEach((b) =>
        b.addEventListener("click", () => { fecharFolha(); resolve(b.dataset.r === "1"); })
      )
    );
  });
}

function carregando(alvo) {
  alvo.innerHTML = `<div class="carregando"><span class="girador"></span>Carregando…</div>`;
}

/** Esconde o aviso ao trocar de tela (exceto se acabou de aparecer). */
function esconderToast() {
  const el = $("#toast");
  if (el && Date.now() - (el._em || 0) > 300) el.classList.remove("visivel");
}

// ===================== Leitor de código de barras =====================
// =============================================================
//  Leitura de código de barras
//  1) Câmera do celular (html5-qrcode, carregado só quando usado)
//  2) Leitor físico USB/Bluetooth (funciona como teclado: digita o
//     código bem rápido e aperta Enter)
// =============================================================

const LIB_URL = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
let libPromessa = null;

function carregarLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (!libPromessa) {
    libPromessa = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = LIB_URL;
      s.onload = res;
      s.onerror = () => {
        libPromessa = null;
        rej(new Error("Não foi possível carregar o leitor de câmera. Verifique a internet."));
      };
      document.head.appendChild(s);
    });
  }
  return libPromessa;
}

/** Sinal de confirmação: bip curto + vibração. */
function sinalLeitura() {
  try { navigator.vibrate?.(80); } catch {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "square";
    o.frequency.value = 1800;
    g.gain.value = 0.06;
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.09);
    o.onended = () => ctx.close();
  } catch {}
}

/**
 * Abre a câmera em tela cheia e resolve com o código lido
 * (ou null se o usuário fechar).
 */
async function lerComCamera() {
  const overlay = document.createElement("div");
  overlay.className = "camera";
  overlay.innerHTML = `
    <div class="camera__topo">
      <span>Aponte para o código de barras</span>
      <button type="button" class="camera__fechar" aria-label="Fechar câmera">✕</button>
    </div>
    <div id="camera-video" class="camera__video"></div>
    <div class="camera__rodape">
      <p class="camera__dica">Segure o celular a uns 15 cm do código, com boa luz.</p>
      <button type="button" class="btn btn--claro camera__lanterna" hidden>🔦 Lanterna</button>
    </div>`;
  document.body.appendChild(overlay);
  document.body.classList.add("sem-rolagem");

  let leitor = null;
  let encerrado = false;

  const encerrar = async () => {
    if (encerrado) return;
    encerrado = true;
    try { if (leitor?.isScanning) await leitor.stop(); } catch {}
    try { leitor?.clear(); } catch {}
    overlay.remove();
    document.body.classList.remove("sem-rolagem");
  };

  return new Promise(async (resolve, reject) => {
    overlay.querySelector(".camera__fechar").onclick = async () => {
      await encerrar();
      resolve(null);
    };
    try {
      await carregarLib();
      const F = window.Html5QrcodeSupportedFormats;
      leitor = new window.Html5Qrcode("camera-video", {
        verbose: false,
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      });
      await leitor.start(
        { facingMode: "environment" },
        {
          fps: 15,
          qrbox: (w, h) => ({ width: Math.floor(Math.min(w * 0.86, 380)), height: Math.floor(Math.min(h * 0.32, 190)) }),
        },
        async (texto) => {
          if (encerrado) return;
          sinalLeitura();
          await encerrar();
          resolve(texto.trim());
        },
        () => {}
      );
      // Lanterna (quando o aparelho suporta)
      try {
        const caps = leitor.getRunningTrackCameraCapabilities?.();
        const torch = caps?.torchFeature?.();
        if (torch?.isSupported()) {
          const b = overlay.querySelector(".camera__lanterna");
          b.hidden = false;
          let ligada = false;
          b.onclick = async () => {
            ligada = !ligada;
            await torch.apply(ligada);
            b.classList.toggle("ativo", ligada);
          };
        }
      } catch {}
    } catch (e) {
      await encerrar();
      const msg = String(e?.message || e);
      if (/Permission|NotAllowed/i.test(msg)) reject(new Error("Permissão da câmera negada. Libere o acesso à câmera nas configurações do navegador."));
      else if (/NotFound|Requested device/i.test(msg)) reject(new Error("Nenhuma câmera encontrada neste aparelho."));
      else if (!window.isSecureContext) reject(new Error("A câmera só funciona em endereço https:// (ex.: GitHub Pages)."));
      else reject(new Error(msg));
    }
  });
}

/**
 * Leitor físico (modo teclado). Captura sequências digitadas muito rápido
 * terminadas em Enter quando nenhum campo de texto está focado.
 * Quando um campo de código está focado, o próprio campo recebe o código.
 */
function escutarLeitorFisico(aoLer) {
  let buffer = "";
  let ultimo = 0;
  window.addEventListener("keydown", (e) => {
    const alvo = e.target;
    const digitando = alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT" || alvo.isContentEditable);
    if (digitando || document.querySelector(".camera")) return;
    const agora = performance.now();
    if (agora - ultimo > 60) buffer = "";
    ultimo = agora;
    if (e.key === "Enter") {
      if (buffer.length >= 4) {
        e.preventDefault();
        const codigo = buffer;
        buffer = "";
        sinalLeitura();
        aoLer(codigo);
      }
      buffer = "";
    } else if (e.key.length === 1) {
      buffer += e.key;
    }
  });
}

function ok({ data, error }) {
  if (error) throw new Error(traduzErro(error));
  return data;
}

function traduzErro(e) {
  const m = e?.message || String(e);
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/duplicate key.*codigo_barras/i.test(m)) return "Já existe um produto com este código de barras.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com a internet.";
  if (/JWT|not authorized|permission denied/i.test(m)) return "Sessão expirada. Entre novamente.";
  return m;
}

async function produtoPorCodigo(codigo) {
  codigo = String(codigo).trim();
  if (modo === "demo") return demo.produtos.find((p) => p.codigo_barras === codigo) ?? null;

async function produtoPorId(id) {
  if (modo === "demo") return demo.produtos.find((p) => p.id === id) ?? null;
  return ok(await sb.from("produtos").select("*").eq("id", id).maybeSingle());
}

async function salvarProduto(p) {
  const dados = {
    codigo_barras: String(p.codigo_barras).trim(),
    nome: p.nome.trim(),
    unidade: p.unidade || "un",
    categoria: p.categoria?.trim() || null,
    dias_alerta: Number(p.dias_alerta),
  };
  if (modo === "demo") {
    const dup = demo.produtos.find((x) => x.codigo_barras === dados.codigo_barras && x.id !== p.id);
    if (dup) throw new Error("Já existe um produto com este código de barras.");
    if (p.id) {
      const atual = demo.produtos.find((x) => x.id === p.id);
      Object.assign(atual, dados, { atualizado_em: agoraISO() });
      demo.salvar();
      return atual;
    }
    const novo = { id: uid(), ativo: true, criado_em: agoraISO(), atualizado_em: agoraISO(), ...dados };
    demo.produtos.push(novo);
    demo.salvar();
    return novo;
  }
  if (p.id) return ok(await sb.from("produtos").update(dados).eq("id", p.id).select().single());
  return ok(await sb.from("produtos").insert(dados).select().single());
}

async function excluirProduto(id) {
  if (modo === "demo") {
    demo.produtos = demo.produtos.filter((p) => p.id !== id);
    demo.lotes = demo.lotes.filter((l) => l.produto_id !== id);
    demo.contagens = demo.contagens.filter((c) => c.produto_id !== id);
    return demo.salvar();
  }
  ok(await sb.from("produtos").delete().eq("id", id));
}

/** Produtos com os seus lotes (todos) — usado em Estoque e Início. */
async function produtosComLotes() {
  if (modo === "demo") {
    return demo.produtos.map((p) => ({ ...p, lotes: demo.lotes.filter((l) => l.produto_id === p.id) }));
  }
  return ok(await sb.from("produtos").select("*, lotes(*)").order("nome"));
}

// ---------------- LOTES / ENTRADAS ----------------
async function registrarEntrada({ produto_id, quantidade, validade, observacao }) {

    quantidade_recebida: Number(quantidade),

  }

/** Lotes com saldo > 0, com o produto embutido, ordenados por validade. */
async function lotesAtivos() {
  if (modo === "demo") {
    return demo.lotes
      .filter((l) => l.quantidade > 0)
      .map((l) => ({ ...l, produtos: demo.produtos.find((p) => p.id === l.produto_id) }))
      .filter((l) => l.produtos)
      .sort((a, b) => a.validade.localeCompare(b.validade));
  }
  return ok(await sb.from("lotes").select("*, produtos(*)").gt("quantidade", 0).order("validade"));
}

async function lotesDoProduto(produto_id, { incluirZerados = false } = {}) {
  if (modo === "demo") {
    return demo.lotes
      .filter((l) => l.produto_id === produto_id && (incluirZerados || l.quantidade > 0))
      .sort((a, b) => a.validade.localeCompare(b.validade));
  }
  let q = sb.from("lotes").select("*").eq("produto_id", produto_id).order("validade");
  if (!incluirZerados) q = q.gt("quantidade", 0);
  return ok(await q);
}

async function entradasRecentes(limite = 8) {
  if (modo === "demo") {
    return [...demo.lotes]
      .sort((a, b) => b.recebido_em.localeCompare(a.recebido_em))
      .slice(0, limite)
      .map((l) => ({ ...l, produtos: demo.produtos.find((p) => p.id === l.produto_id) }));
  }
  return ok(await sb.from("lotes").select("*, produtos(*)").order("recebido_em", { ascending: false }).limit(limite));
}

async function atualizarValidade(lote_id, validade) {
  if (modo === "demo") {
    demo.lotes.find((l) => l.id === lote_id).validade = validade;
    return demo.salvar();
  }
  ok(await sb.from("lotes").update({ validade }).eq("id", lote_id));
}

async function excluirLote(lote_id) {
  if (modo === "demo") {
    demo.lotes = demo.lotes.filter((l) => l.id !== lote_id);
    return demo.salvar();
  }
  ok(await sb.from("lotes").delete().eq("id", lote_id));
}

// ---------------- CONTAGEM ----------------
/** Registra a contagem de um lote e ajusta o saldo para o valor contado. */
async function registrarContagem(lote, quantidade_contada) {
  const reg = {
    lote_id: lote.id,
    produto_id: lote.produto_id,
    quantidade_anterior: Number(lote.quantidade),
    quantidade_contada: Number(quantidade_contada),
  };
  if (modo === "demo") {
    demo.contagens.push({ id: uid(), contado_em: agoraISO(), contado_por: "demonstracao@paulus", ...reg });
    demo.lotes.find((l) => l.id === lote.id).quantidade = reg.quantidade_contada;
    return demo.salvar();
  }
  ok(await sb.from("contagens").insert(reg));
  ok(await sb.from("lotes").update({ quantidade: reg.quantidade_contada }).eq("id", lote.id));
}

async function contagensDesde(desdeISO) {
  if (modo === "demo") {
    return demo.contagens
      .filter((c) => c.contado_em >= desdeISO)
      .sort((a, b) => b.contado_em.localeCompare(a.contado_em))
      .map((c) => ({
        ...c,
        produtos: demo.produtos.find((p) => p.id === c.produto_id),
        lotes: demo.lotes.find((l) => l.id === c.lote_id) ?? null,
      }));
  }
  return ok(
    await sb
      .from("contagens")
      .select("*, produtos(*), lotes(validade)")
      .gte("contado_em", desdeISO)
      .order("contado_em", { ascending: false })
  );
}

async function contagensDoProduto(produto_id, limite = 20) {
  if (modo === "demo") {
    return demo.contagens
      .filter((c) => c.produto_id === produto_id)
      .sort((a, b) => b.contado_em.localeCompare(a.contado_em))
      .slice(0, limite)
      .map((c) => ({ ...c, lotes: demo.lotes.find((l) => l.id === c.lote_id) ?? null }));
  }
  return ok(
    await sb
      .from("contagens")
      .select("*, lotes(validade)")
      .eq("produto_id", produto_id)
      .order("contado_em", { ascending: false })
      .limit(limite)
  );
}

// ---------------- TEMPO REAL ----------------
function aoMudarDados(cb) {
  if (modo === "demo") {
    window.addEventListener("storage", (e) => e.key === demo.CHAVE && (demo.carregar(), cb()));
    return;
  }
  sb.channel("estoque")
    .on("postgres_changes", { event: "*", schema: "public", table: "lotes" }, cb)
    .on("postgres_changes", { event: "*", schema: "public", table: "produtos" }, cb)
    .on("postgres_changes", { event: "*", schema: "public", table: "contagens" }, cb)
    .subscribe();
}

// ---------------- MODO DEMONSTRAÇÃO ----------------
function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now();
}
function agoraISO() {
  return new Date().toISOString();
}
function diaMais(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString("sv-SE"); // AAAA-MM-DD no fuso local
}

const demo = {
  CHAVE: "estoque-paulus-demo-v1",
  produtos: [],
  lotes: [],
  contagens: [],
  carregar() {
    try {
      const salvo = JSON.parse(localStorage.getItem(this.CHAVE) || "null");
      if (salvo) return Object.assign(this, salvo);
    } catch {}
    this.semear();
  },
  salvar() {
    try {
      localStorage.setItem(
        this.CHAVE,
        JSON.stringify({ produtos: this.produtos, lotes: this.lotes, contagens: this.contagens })
      );
    } catch {}
  },
  semear() {
    const base = [
      ["7891000100103", "Leite integral 1L", "un", "Laticínios", 5, [[24, 3], [12, 9]]],
      ["7896005800027", "Creme de leite 200g", "un", "Laticínios", 10, [[36, 6]]],
      ["7891910000197", "Açúcar refinado 1kg", "pct", "Mercearia", 30, [[20, 120]]],
      ["7896036090244", "Molho de tomate 340g", "un", "Mercearia", 15, [[18, 40], [6, 75]]],
      ["7894900011517", "Refrigerante cola 2L", "un", "Bebidas", 15, [[24, 12]]],
      ["7891149103102", "Manteiga com sal 200g", "un", "Laticínios", 7, [[8, -2]]],
      ["2000000000015", "Filé de frango", "kg", "Carnes", 3, [[15.5, 2], [10, 5]]],
      ["7896079500151", "Azeite extra virgem 500ml", "un", "Mercearia", 30, [[10, 210]]],
    ];
    this.produtos = [];
    this.lotes = [];
    this.contagens = [];
    const ontem = new Date(Date.now() - 864e5).toISOString();
    for (const [codigo, nome, unidade, categoria, dias_alerta, lotes] of base) {
      const p = { id: uid(), codigo_barras: codigo, nome, unidade, categoria, dias_alerta, ativo: true, criado_em: ontem, atualizado_em: ontem };
      this.produtos.push(p);
      for (const [q, d] of lotes) {
        this.lotes.push({
          id: uid(), produto_id: p.id, quantidade: q, quantidade_recebida: q, validade: diaMais(d),
          observacao: null, recebido_em: ontem, recebido_por: "demonstracao@paulus",
        });
      }
    }
    this.salvar();
  },
};

function reiniciarDemo() {
  demo.semear();
}

  return {
    get modo() { return modo; },
    iniciar, usuarioAtual, entrar, sair, aoMudarSessao, produtoPorCodigo, produtoPorId, salvarProduto, excluirProduto, produtosComLotes, registrarEntrada, lotesAtivos, lotesDoProduto, entradasRecentes, atualizarValidade, excluirLote, registrarContagem, contagensDesde, contagensDoProduto, aoMudarDados, reiniciarDemo,
  };
})();

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function lerRota() {
  const h = location.hash.replace(/^#\/?/, "");
  const [caminho, busca = ""] = h.split("?");
  const partes = caminho.split("/").filter(Boolean);
  return { nome: partes[0] || "inicio", id: partes[1], params: new URLSearchParams(busca) };
}

async function rotear() {
  if (!usuario) return;
  const r = lerRota();
  rotaAtual = r.nome;
  esconderToast();
  const destaque = r.nome === "produto" ? "estoque" : r.nome;
  $$(".abas a").forEach((a) => a.classList.toggle("ativa", a.dataset.rota === destaque));
  const alvo = $("#conteudo");
  if (!alvo) return;
  window.scrollTo(0, 0);
  try {
    switch (r.nome) {
      case "receber": return await receber.tela(alvo, r.params);
      case "contagem": return await contagem.tela(alvo, r.params);
      case "validade": return await telaValidade(alvo, r.params);
      case "estoque": return await telaEstoque(alvo);
      case "produto": return await telaProduto(alvo, r.id);
      default: return await telaInicio(alvo);
    }
  } catch (e) {
    console.error(e);
    alvo.innerHTML = `<div class="erro-geral">${icone("alerta")}<p>Algo deu errado.</p><small>${esc(e.message)}</small>
      <button class="btn btn--primario" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}

function ligarChipsAlerta(raiz) {
  const input = $('[name="dias_alerta"]', raiz);
  const sync = () => $$("[data-dias]", raiz).forEach((c) => c.classList.toggle("ativo", c.dataset.dias === input.value));
  $$("[data-dias]", raiz).forEach((c) => (c.onclick = () => { input.value = c.dataset.dias; sync(); }));
  input.oninput = sync;
}

async function categoriasExistentes() {
  const ps = await db.produtosComLotes();
  return [...new Set(ps.map((p) => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

function validarProduto(form) {
  const nome = form.nome.value.trim();
  const dias = lerNumero(form.dias_alerta.value);
  if (!nome) return "Informe o nome do produto.";
  if (!Number.isInteger(dias) || dias < 0) return "Informe em quantos dias antes de vencer o app deve avisar.";
  return null;
}

/** Busca nome sugerido no Open Food Facts (base pública de produtos). */
async function sugerirNome(codigo) {
  if (!/^\d{8,14}$/.test(codigo)) return null;
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codigo}.json?fields=product_name_pt,product_name,brands,quantity`, { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (j.status !== 1) return null;
    const p = j.product || {};
    const nome = p.product_name_pt || p.product_name;
    if (!nome) return null;
    return [nome, p.brands?.split(",")[0], p.quantity].filter(Boolean).join(" ").trim();
  } catch {
    return null;
  }
}

  for (const p of produtos) for (const l of p.lotes) if (Number(l.quantidade) > 0) lotes.push({ ...l, produto: p, sit: situacao(l.validade, p.dias_alerta) });
  const vencidos = lotes.filter((l) => l.sit.tipo === "vencido");
  const alerta = lotes.filter((l) => l.sit.tipo === "alerta");
  const comSaldo = produtos.filter((p) => p.lotes.some((l) => Number(l.quantidade) > 0)).length;
  const hoje = hojeStr();
  const entradasHoje = produtos.flatMap((p) => p.lotes).filter((l) => new Date(l.recebido_em).toLocaleDateString("sv-SE") === hoje).length;
  const atencao = [...vencidos, ...alerta].sort((a, b) => a.sit.dias - b.sit.dias).slice(0, 6);

      <a href="#/contagem" class="acao-rapida">${icone("contagem")}<span><strong>Fazer contagem</strong><small>Conferir saldo por lote</small></span></a>
    </section>

    <section class="secao">

        ? `<ul class="lista">${recentes.map((l) => `
            <li><a class="item" href="#/produto/${l.produto_id}">

function dataExtenso() {
  const t = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function itemLote(l) {
  const p = l.produto || l.produtos;
  const s = l.sit || situacao(l.validade, p.dias_alerta);

}

async function folhaLote(loteId) {
  const lotes = await db.lotesAtivos();
  const l = lotes.find((x) => x.id === loteId);
  if (!l) return toast("Lote não encontrado (pode ter sido zerado).", "erro");
  const p = l.produtos;
  const s = situacao(l.validade, p.dias_alerta);
  abrirFolha(
    `<h2 class="folha__titulo">${esc(p.nome)}</h2>
     <div class="detalhes">
       <div><span>Saldo do lote</span><strong>${fmtQtd(l.quantidade)} ${esc(p.unidade)}</strong></div>
       <div><span>Validade</span><strong>${fmtData(l.validade)}</strong></div>
       <div><span>Situação</span>${seloSituacao(s)}</div>
       <div><span>Recebido</span><strong>${fmtDataHora(l.recebido_em)}</strong></div>
       <div><span>Qtd. recebida</span><strong>${fmtQtd(l.quantidade_recebida)} ${esc(p.unidade)}</strong></div>
       <div><span>Alerta</span><strong>${p.dias_alerta} dias antes</strong></div>
       ${l.recebido_por ? `<div class="detalhes__largo"><span>Por</span><strong>${esc(l.recebido_por)}</strong></div>` : ""}
       ${l.observacao ? `<div class="detalhes__largo"><span>Observação</span><strong>${esc(l.observacao)}</strong></div>` : ""}
     </div>
     <form class="form-linha" id="fQtd">
       <label class="campo"><span>Contagem deste lote (${esc(p.unidade)})</span>
         <input name="q" inputmode="decimal" placeholder="${fmtQtd(l.quantidade)}" required></label>
       <button class="btn btn--primario">Salvar</button>
     </form>
     <form class="form-linha" id="fVal">
       <label class="campo"><span>Corrigir validade</span>
         <input name="v" type="date" value="${l.validade}" required></label>
       <button class="btn btn--claro">Salvar</button>
     </form>
     <div class="acoes-folha">
       <a class="btn btn--claro" href="#/produto/${p.id}">Ver produto</a>
       <button type="button" class="btn btn--perigo-texto" id="bExcluir">${icone("lixo")} Excluir lote</button>
     </div>`,
    (f) => {
      $("#fQtd", f).onsubmit = async (e) => {
        e.preventDefault();
        const q = lerNumero(e.target.q.value);
        if (!(q >= 0)) return toast("Informe uma quantidade válida.", "erro");
        await db.registrarContagem(l, q);
        fecharFolha();
        toast(q === 0 ? "Lote zerado e removido do estoque." : "Contagem registrada.");
        rotear();
      };
      $("#fVal", f).onsubmit = async (e) => {
        e.preventDefault();
        await db.atualizarValidade(l.id, e.target.v.value);
        fecharFolha();
        toast("Validade corrigida.");
        rotear();
      };
      $("#bExcluir", f).onclick = async () => {
        fecharFolha();
        const okEx = await confirmar({ titulo: "Excluir lote?", texto: "Use apenas para corrigir um lançamento errado. Esta ação não pode ser desfeita.", botao: "Excluir", perigo: true });
        if (!okEx) return;
        await db.excluirLote(l.id);
        toast("Lote excluído.");
        rotear();
      };
    }
  );
}
