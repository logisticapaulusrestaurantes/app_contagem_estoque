const receber = {
  alvo: null,
  sessao: [], // entradas feitas nesta tela, para poder desfazer

  async tela(alvo, params) {
    this.alvo = alvo;
    alvo.innerHTML = `
      <div class="titulo-tela"><h1>Receber mercadoria</h1><p>Bipe o produto, informe a quantidade e a validade.</p></div>
      <div id="rec-etapa"></div>
      <section class="secao" id="rec-sessao"></section>`;
    this.mostrarBipar();
    this.renderSessao();
    const codigo = params.get("codigo");
    if (codigo) {
      history.replaceState(null, "", "#/receber");
      this.buscar(codigo);
    }
  },

  mostrarBipar() {
    const etapa = $("#rec-etapa", this.alvo);
    etapa.innerHTML = blocoBipar({
      titulo: `${icone("bipar")} Bipe o código de barras`,
      dica: "Use a câmera do celular ou um leitor USB/Bluetooth.",
      extra: `<button type="button" class="link-acao" data-acao="sem-codigo">Produto sem código de barras? Cadastrar manualmente</button>`,
    });
    ligarBipar(etapa, (c) => this.buscar(c));
    $('[data-acao="sem-codigo"]', etapa).onclick = () => this.formulario(null, "", true);
  },

  async buscar(codigo) {
    if (!$("#rec-etapa")) return;
    const etapa = $("#rec-etapa", this.alvo);
    carregando(etapa);
    try {
      const p = await db.produtoPorCodigo(codigo);
      this.formulario(p, codigo, false);
    } catch (e) {
      toast(e.message, "erro");
      this.mostrarBipar();
    }
  },

  async formulario(produto, codigo, semCodigo) {
    const etapa = $("#rec-etapa", this.alvo);
    const novo = !produto;
    const [lotes, categorias] = await Promise.all([
      produto ? db.lotesDoProduto(produto.id) : [],
      novo ? categoriasExistentes() : [],
    ]);
    const codigoInterno = semCodigo ? "INT" + Date.now().toString().slice(-9) : codigo;

    etapa.innerHTML = `
      <form class="cartao form-entrada" novalidate>
        ${novo
          ? `<div class="aviso aviso--info">${icone("mais")}<div><strong>Produto novo</strong>
               <p>${semCodigo ? "Cadastre o produto. Um código interno foi gerado." : `Código <strong>${esc(codigo)}</strong> ainda não cadastrado. Preencha os dados abaixo.`}</p></div></div>
             ${semCodigo ? `<label class="campo"><span>Código interno</span><input name="codigo_barras" value="${esc(codigoInterno)}" required></label>` : ""}
             ${camposProduto({}, categorias)}
             <hr>`
          : cartaoProduto(produto, lotes)}

        <h3 class="form-entrada__titulo">Entrada</h3>
        <div class="campo">
          <span>Quantidade recebida *</span>
          <div class="contador">
            <button type="button" class="contador__btn" data-passo="-1" aria-label="Diminuir">${icone("menos")}</button>
            <input name="quantidade" inputmode="decimal" required placeholder="0" aria-label="Quantidade" autocomplete="off">
            <span class="contador__un">${esc(produto?.unidade || "un")}</span>
            <button type="button" class="contador__btn" data-passo="1" aria-label="Aumentar">${icone("mais")}</button>
          </div>
        </div>
        <label class="campo"><span>Data de validade *</span>
          <input name="validade" type="date" required>
        </label>
        <p class="previa-validade" aria-live="polite"></p>
        <label class="campo"><span>Observação <em>(opcional)</em></span>
          <input name="observacao" maxlength="200" placeholder="Ex.: NF 1234, fornecedor, lote do fabricante"></label>
        <p class="erro-form" hidden></p>
        <div class="acoes-form">
          <button type="button" class="btn btn--claro" data-acao="cancelar">Cancelar</button>
          <button type="submit" class="btn btn--primario btn--grande">Salvar entrada</button>
        </div>
      </form>`;

    const form = $("form", etapa);
    const qtd = form.quantidade;
    const unSpan = $(".contador__un", form);

    if (novo) {
      ligarChipsAlerta(form);
      form.unidade.onchange = () => (unSpan.textContent = form.unidade.value);
      if (!semCodigo) {
        form.nome.focus();
        sugerirNome(codigo).then((nome) => {
          if (nome && form.isConnected && !form.nome.value) {
            form.nome.value = nome;
            toast("Nome sugerido pela base de produtos. Confira antes de salvar.", "info");
          }
        });
      } else form.nome.focus();
    } else {
      qtd.focus();
    }

    $$("[data-passo]", form).forEach((b) => (b.onclick = () => {
      const atual = lerNumero(qtd.value) || 0;
      qtd.value = fmtQtd(Math.max(0, atual + Number(b.dataset.passo)));
    }));

    const previa = $(".previa-validade", form);
    const atualizarPrevia = () => {
      const v = form.validade.value;
      if (!v) return (previa.innerHTML = "");
      const dias = novo ? lerNumero(form.dias_alerta.value) : produto.dias_alerta;
      const s = situacao(v, Number.isFinite(dias) ? dias : DIAS_ALERTA_PADRAO);
      previa.innerHTML = `${seloSituacao(s)}${s.tipo === "vencido" ? " <small>Atenção: este produto já chega vencido.</small>" : ""}`;
    };
    form.validade.oninput = atualizarPrevia;
    form.validade.onchange = atualizarPrevia;
    if (novo) form.dias_alerta.addEventListener("input", atualizarPrevia);

    $('[data-acao="cancelar"]', form).onclick = () => this.mostrarBipar();

    form.onsubmit = async (e) => {
      e.preventDefault();
      const erro = $(".erro-form", form);
      const falhar = (m) => { erro.textContent = m; erro.hidden = false; };
      erro.hidden = true;
      if (novo) {
        const m = validarProduto(form);
        if (m) return falhar(m);
      }
      const q = lerNumero(qtd.value);
      if (!(q > 0)) return falhar("Informe a quantidade recebida.");
      if (!form.validade.value) return falhar("Informe a data de validade.");
      const ano = Number(form.validade.value.slice(0, 4));
      if (ano < 2000 || ano > 2100) return falhar("Data de validade inválida.");

      const btn = $('[type="submit"]', form);
      btn.disabled = true;
      btn.textContent = "Salvando…";
      try {
        let p = produto;
        if (novo) {
          p = await db.salvarProduto({
            codigo_barras: semCodigo ? form.codigo_barras.value : codigo,
            nome: form.nome.value,
            unidade: form.unidade.value,
            categoria: form.categoria.value,
            dias_alerta: lerNumero(form.dias_alerta.value),
          });
        }
        const lote = await db.registrarEntrada({
          produto_id: p.id, quantidade: q, validade: form.validade.value, observacao: form.observacao.value,
        });
        this.sessao.unshift({ lote, produto: p });
        toast(`Entrada salva: ${fmtQtd(q)} ${p.unidade} de ${p.nome}`);
        this.mostrarBipar();
        this.renderSessao();
      } catch (err) {
        falhar(err.message);
        btn.disabled = false;
        btn.textContent = "Salvar entrada";
      }
    };
  },

  renderSessao() {
    const el = $("#rec-sessao", this.alvo);
    if (!el) return;
    if (!this.sessao.length) return (el.innerHTML = "");
    el.innerHTML = `
      <div class="secao__cab"><h2>Recebido agora</h2><small>${this.sessao.length} ${this.sessao.length === 1 ? "entrada" : "entradas"}</small></div>
      <ul class="lista">${this.sessao.map(({ lote, produto }, i) => {
        const s = situacao(lote.validade, produto.dias_alerta);
        return `<li class="item item--${s.tipo}">
          <span class="item__barra"></span>
          <span class="item__principal"><strong>${esc(produto.nome)}</strong>
            <small>${fmtQtd(lote.quantidade_recebida)} ${esc(produto.unidade)} · validade ${fmtData(lote.validade)}</small></span>
          <span class="item__lado">
            <button type="button" class="btn-icone" data-desfazer="${i}" aria-label="Desfazer entrada">${icone("desfazer")}</button>
          </span></li>`;
      }).join("")}</ul>`;
    $$("[data-desfazer]", el).forEach((b) => (b.onclick = async () => {
      const i = Number(b.dataset.desfazer);
      const { lote, produto } = this.sessao[i];
      const okD = await confirmar({ titulo: "Desfazer entrada?", texto: `${fmtQtd(lote.quantidade_recebida)} ${produto.unidade} de ${produto.nome}, validade ${fmtData(lote.validade)}.`, botao: "Desfazer", perigo: true });
      if (!okD) return;
      await db.excluirLote(lote.id);
      this.sessao.splice(i, 1);
      this.renderSessao();
      toast("Entrada desfeita.");
    }));
  },
};

// =============================================================
//  TELA: CONTAGEM DE ESTOQUE
// =============================================================
const contagem = {
  alvo: null,

  async tela(alvo, params) {
    this.alvo = alvo;
    alvo.innerHTML = `
      <div class="titulo-tela"><h1>Contagem de estoque</h1><p>Bipe cada produto e informe quanto há de cada lote.</p></div>
      <section class="cartao progresso" id="cont-progresso"><div class="carregando"><span class="girador"></span></div></section>
      <div id="cont-etapa"></div>
      <section class="secao" id="cont-faltam"></section>
      <section class="secao" id="cont-hoje"></section>`;
    this.mostrarBipar();
    await this.atualizarResumo();
    const pid = params.get("produto");
    if (pid) {
      history.replaceState(null, "", "#/contagem");
      const p = await db.produtoPorId(pid);
      if (p) this.abrirProduto(p);
    }
  },

  mostrarBipar() {
    const etapa = $("#cont-etapa", this.alvo);
    etapa.innerHTML = blocoBipar({ titulo: `${icone("contagem")} Bipe o produto a contar`, dica: "Os lotes do produto aparecem para você conferir." });
    ligarBipar(etapa, (c) => this.buscar(c));
  },

  async buscar(codigo) {
    if (!$("#cont-etapa")) return;
    const etapa = $("#cont-etapa", this.alvo);
    carregando(etapa);
    const p = await db.produtoPorCodigo(codigo);
    if (!p) {
      etapa.innerHTML = `
        <section class="cartao">
          <div class="aviso aviso--alerta">${icone("alerta")}<div><strong>Produto não cadastrado</strong>
            <p>O código <strong>${esc(codigo)}</strong> não existe no sistema. Cadastre-o registrando a entrada.</p></div></div>
          <div class="acoes-form">
            <button type="button" class="btn btn--claro" data-acao="voltar">Voltar</button>
            <a class="btn btn--primario" href="#/receber?codigo=${encodeURIComponent(codigo)}">Registrar entrada</a>
          </div>
        </section>`;
      $('[data-acao="voltar"]', etapa).onclick = () => this.mostrarBipar();
      return;
    }
    this.abrirProduto(p);
  },

  async abrirProduto(p) {
    const etapa = $("#cont-etapa", this.alvo);
    carregando(etapa);
    const lotes = await db.lotesDoProduto(p.id);
    etapa.innerHTML = `
      <form class="cartao form-contagem" novalidate>
        ${cartaoProduto(p, lotes)}
        ${lotes.length
          ? `<div class="lotes-contagem">
              ${lotes.map((l) => {
                const s = situacao(l.validade, p.dias_alerta);
                return `<div class="lote-cont lote-cont--${s.tipo}">
                  <div class="lote-cont__info">
                    <strong>Validade ${fmtData(l.validade)}</strong>
                    ${seloSituacao(s)}
                    <small>Sistema: <b>${fmtQtd(l.quantidade)} ${esc(p.unidade)}</b></small>
                  </div>
                  <label class="lote-cont__campo"><span>Contado</span>
                    <input name="l_${l.id}" data-sistema="${l.quantidade}" inputmode="decimal" placeholder="${fmtQtd(l.quantidade)}" autocomplete="off"></label>
                </div>`;
              }).join("")}
            </div>
            <button type="button" class="link-acao" data-acao="confere">${icone("ok")} Tudo confere com o sistema</button>`
          : `<div class="vazio"><p>Este produto não tem lotes com saldo.</p></div>`}
        <a class="link-acao" href="#/receber?codigo=${encodeURIComponent(p.codigo_barras)}">${icone("mais")} Encontrou um lote com outra validade? Registrar entrada</a>
        <p class="erro-form" hidden></p>
        <div class="acoes-form">
          <button type="button" class="btn btn--claro" data-acao="voltar">Voltar</button>
          ${lotes.length ? `<button type="submit" class="btn btn--primario btn--grande">Confirmar contagem</button>` : ""}
        </div>
      </form>`;
    const form = $("form", etapa);
    $('[data-acao="voltar"]', form).onclick = () => this.mostrarBipar();
    const primeiro = $(".lote-cont input", form);
    if (primeiro && telaFina) primeiro.focus();
    const conf = $('[data-acao="confere"]', form);
    if (conf) conf.onclick = () => $$(".lote-cont input", form).forEach((i) => (i.value = fmtQtd(i.dataset.sistema)));

    form.onsubmit = async (e) => {
      e.preventDefault();
      const erro = $(".erro-form", form);
      erro.hidden = true;
      const registros = [];
      for (const l of lotes) {
        const v = form[`l_${l.id}`].value;
        if (v.trim() === "") continue;
        const q = lerNumero(v);
        if (!(q >= 0)) { erro.textContent = "Há uma quantidade inválida."; erro.hidden = false; return; }
        registros.push([l, q]);
      }
      if (!registros.length) { erro.textContent = "Preencha a quantidade contada de pelo menos um lote."; erro.hidden = false; return; }
      const btn = $('[type="submit"]', form);
      btn.disabled = true;
      btn.textContent = "Salvando…";
      try {
        for (const [l, q] of registros) await db.registrarContagem(l, q);
        const difs = registros.filter(([l, q]) => Number(l.quantidade) !== q).length;
        toast(difs ? `Contagem salva — ${difs} ${difs === 1 ? "lote ajustado" : "lotes ajustados"}.` : "Contagem salva — tudo confere!");
        this.mostrarBipar();
        this.atualizarResumo();
      } catch (err) {
        erro.textContent = err.message;
        erro.hidden = false;
        btn.disabled = false;
        btn.textContent = "Confirmar contagem";
      }
    };
  },

  async atualizarResumo() {
    if (!$("#cont-progresso")) return;
    const [produtos, hoje] = await Promise.all([db.produtosComLotes(), db.contagensDesde(inicioDoDiaISO())]);
    const contadosIds = new Set(hoje.map((c) => c.produto_id));
    const comSaldo = produtos.filter((p) => p.lotes.some((l) => Number(l.quantidade) > 0));
    const feitos = comSaldo.filter((p) => contadosIds.has(p.id)).length;
    const total = comSaldo.length;
    const pct = total ? Math.round((feitos / total) * 100) : 0;
    const faltam = comSaldo.filter((p) => !contadosIds.has(p.id)).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

    $("#cont-progresso").innerHTML = `
      <div class="progresso__texto"><strong>${feitos} de ${total}</strong> produtos contados hoje <span>${pct}%</span></div>
      <div class="progresso__barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>`;

    $("#cont-faltam").innerHTML = faltam.length
      ? `<details class="dobra">
          <summary><h2>Faltam contar</h2><small>${faltam.length}</small></summary>
          <ul class="lista">${faltam.map((p) => `
            <li><button type="button" class="item" data-contar="${p.id}">
              <span class="item__principal"><strong>${esc(p.nome)}</strong><small>${esc(p.codigo_barras)}</small></span>
              <span class="item__lado">${icone("seta")}</span></button></li>`).join("")}</ul>
        </details>`
      : total ? `<div class="vazio">${icone("ok")}<p>Todos os produtos foram contados hoje.</p></div>` : "";
    $$("[data-contar]", $("#cont-faltam")).forEach((b) => (b.onclick = async () => {
      const p = faltam.find((x) => x.id === b.dataset.contar);
      await this.abrirProduto(p);
      $("#cont-etapa").scrollIntoView({ behavior: "smooth" });
    }));

    $("#cont-hoje").innerHTML = hoje.length
      ? `<div class="secao__cab"><h2>Contados hoje</h2><small>${hoje.length} ${hoje.length === 1 ? "registro" : "registros"}</small></div>
         <ul class="lista">${hoje.map((c) => {
           const dif = Number(c.quantidade_contada) - Number(c.quantidade_anterior);
           const cls = dif === 0 ? "igual" : dif > 0 ? "sobra" : "falta";
           return `<li class="item">
             <span class="item__principal"><strong>${esc(c.produtos?.nome)}</strong>
               <small>${c.lotes?.validade ? `validade ${fmtData(c.lotes.validade)} · ` : ""}${fmtDataHora(c.contado_em)}</small></span>
             <span class="item__lado diferenca diferenca--${cls}">
               <small>${fmtQtd(c.quantidade_anterior)} → <b>${fmtQtd(c.quantidade_contada)}</b></small>
               <em>${dif === 0 ? "confere" : (dif > 0 ? "+" : "") + fmtQtd(dif)}</em></span>
           </li>`;
         }).join("")}</ul>`
      : "";
  },
};

// =============================================================
//  TELA: VALIDADE
// =============================================================
async function telaValidade(alvo, params) {
  carregando(alvo);
  const lotes = (await db.lotesAtivos()).map((l) => ({ ...l, sit: situacao(l.validade, l.produtos.dias_alerta) }));
  const cont = { todos: lotes.length, vencido: 0, alerta: 0, ok: 0 };
  lotes.forEach((l) => cont[l.sit.tipo]++);
  let filtro = params.get("filtro") || "todos";
  let busca = "";

  alvo.innerHTML = `
    <div class="titulo-tela"><h1>Validade</h1><p>Lotes em estoque, do que vence primeiro ao último.</p></div>
    <div class="chips chips--rolagem" role="tablist">
      ${[["todos", "Todos"], ["vencido", "Vencidos"], ["alerta", "Vencendo"], ["ok", "No prazo"]]
        .map(([k, t]) => `<button type="button" class="chip chip--${k}" data-filtro="${k}" role="tab">${t} <b>${cont[k]}</b></button>`).join("")}
    </div>
    <label class="busca">${icone("busca")}<input type="search" placeholder="Buscar produto ou código" aria-label="Buscar"></label>
    <ul class="lista" id="lista-validade"></ul>`;

  const lista = $("#lista-validade");
  const desenhar = () => {
    $$("[data-filtro]").forEach((c) => c.classList.toggle("ativo", c.dataset.filtro === filtro));
    const termo = busca.toLowerCase();
    const itens = lotes.filter((l) =>
      (filtro === "todos" || l.sit.tipo === filtro) &&
      (!termo || l.produtos.nome.toLowerCase().includes(termo) || l.produtos.codigo_barras.includes(termo))
    );
    lista.innerHTML = itens.length
      ? itens.map(itemLote).join("")
      : `<li class="vazio">${icone("ok")}<p>${filtro === "vencido" ? "Nenhum lote vencido." : filtro === "alerta" ? "Nada vencendo em breve." : "Nenhum lote encontrado."}</p></li>`;
  };
  $$("[data-filtro]").forEach((c) => (c.onclick = () => { filtro = c.dataset.filtro; desenhar(); }));
  $(".busca input").oninput = (e) => { busca = e.target.value.trim(); desenhar(); };
  desenhar();
}

// =============================================================
//  TELA: ESTOQUE
// =============================================================
async function telaEstoque(alvo) {
  carregando(alvo);
  const produtos = await db.produtosComLotes();
  const linhas = produtos.map((p) => {
    const ativos = p.lotes.filter((l) => Number(l.quantidade) > 0).sort((a, b) => a.validade.localeCompare(b.validade));
    const total = ativos.reduce((s, l) => s + Number(l.quantidade), 0);
    const pior = ativos.map((l) => situacao(l.validade, p.dias_alerta)).sort((a, b) => ORDEM_SITUACAO[a.tipo] - ORDEM_SITUACAO[b.tipo])[0];
    return { p, ativos, total, pior };
  }).sort((a, b) => (b.total > 0) - (a.total > 0) || a.p.nome.localeCompare(b.p.nome, "pt-BR"));

  let busca = "";
  let mostrarZerados = false;

  alvo.innerHTML = `
    <div class="titulo-tela titulo-tela--acoes">
      <div><h1>Estoque</h1><p>${linhas.filter((l) => l.total > 0).length} produtos com saldo</p></div>
      <button type="button" class="btn btn--claro btn--pequeno" id="bCsv">${icone("baixar")} Exportar</button>
    </div>
    <label class="busca">${icone("busca")}<input type="search" placeholder="Buscar produto, código ou categoria" aria-label="Buscar"></label>
    <label class="alternar"><input type="checkbox" id="cZerados"> Mostrar produtos sem saldo</label>
    <ul class="lista" id="lista-estoque"></ul>
    <a href="#/receber" class="btn btn--primario btn--bloco">${icone("mais")} Nova entrada</a>`;

  const lista = $("#lista-estoque");
  const desenhar = () => {
    const t = busca.toLowerCase();
    const itens = linhas.filter(({ p, total }) =>
      (mostrarZerados || total > 0) &&
      (!t || p.nome.toLowerCase().includes(t) || p.codigo_barras.includes(t) || (p.categoria || "").toLowerCase().includes(t))
    );
    lista.innerHTML = itens.length
      ? itens.map(({ p, ativos, total, pior }) => `
        <li><a class="item ${pior ? `item--${pior.tipo}` : "item--zerado"}" href="#/produto/${p.id}">
          <span class="item__barra"></span>
          <span class="item__principal"><strong>${esc(p.nome)}</strong>
            <small>${esc(p.categoria || "Sem categoria")} · ${ativos.length ? `próx. validade ${fmtData(ativos[0].validade)}` : "sem saldo"}</small></span>
          <span class="item__lado item__qtd"><b>${fmtQtd(total)}</b><small>${esc(p.unidade)}${ativos.length > 1 ? ` · ${ativos.length} lotes` : ""}</small></span>
        </a></li>`).join("")
      : `<li class="vazio"><p>${linhas.length ? "Nenhum produto encontrado." : "Nenhum produto cadastrado ainda. Faça a primeira entrada!"}</p></li>`;
  };
  $(".busca input").oninput = (e) => { busca = e.target.value.trim(); desenhar(); };
  $("#cZerados").onchange = (e) => { mostrarZerados = e.target.checked; desenhar(); };
  $("#bCsv").onclick = () => exportarCsv(linhas);
  desenhar();
}

function exportarCsv(linhas) {
  const cab = ["Produto", "Código de barras", "Categoria", "Unidade", "Validade", "Quantidade", "Situação", "Alerta (dias)", "Recebido em"];
  const rows = [cab];
  for (const { p, ativos } of linhas) {
    for (const l of ativos) {
      const s = situacao(l.validade, p.dias_alerta);
      rows.push([p.nome, p.codigo_barras, p.categoria || "", p.unidade, fmtData(l.validade), fmtQtd(l.quantidade), s.texto, p.dias_alerta, new Date(l.recebido_em).toLocaleDateString("pt-BR")]);
    }
  }
  const csv = "﻿" + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `estoque-paulus-${hojeStr()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Planilha exportada.");
}

// =============================================================
//  TELA: PRODUTO (detalhes e edição)
// =============================================================
async function telaProduto(alvo, id) {
  carregando(alvo);
  const p = await db.produtoPorId(id);
  if (!p) {
    alvo.innerHTML = `<div class="vazio"><p>Produto não encontrado.</p><a class="btn btn--claro" href="#/estoque">Voltar ao estoque</a></div>`;
    return;
  }
  const [lotes, historico, categorias] = await Promise.all([db.lotesDoProduto(p.id), db.contagensDoProduto(p.id), categoriasExistentes()]);

  alvo.innerHTML = `
    <a href="#/estoque" class="voltar">${icone("voltar")} Estoque</a>
    <section class="cartao">${cartaoProduto(p, lotes, { editar: false })}
      <div class="acoes-form">
        <a class="btn btn--claro" href="#/contagem?produto=${p.id}">${icone("contagem")} Contar</a>
        <a class="btn btn--primario" href="#/receber?codigo=${encodeURIComponent(p.codigo_barras)}">${icone("mais")} Entrada</a>
      </div>
    </section>

    <section class="secao">
      <div class="secao__cab"><h2>Lotes em estoque</h2></div>
      ${lotes.length ? `<ul class="lista">${lotes.map((l) => itemLote({ ...l, produto: p })).join("")}</ul>` : `<div class="vazio"><p>Sem saldo no momento.</p></div>`}
    </section>

    <details class="secao dobra cartao">
      <summary><h2>${icone("editar")} Editar produto e alerta</h2></summary>
      <form id="fProd" novalidate>
        <label class="campo"><span>Código de barras *</span><input name="codigo_barras" required value="${esc(p.codigo_barras)}"></label>
        ${camposProduto(p, categorias)}
        <p class="erro-form" hidden></p>
        <button class="btn btn--primario btn--bloco" type="submit">Salvar alterações</button>
      </form>
    </details>

    <section class="secao">
      <div class="secao__cab"><h2>Histórico de contagens</h2></div>
      ${historico.length
        ? `<ul class="lista">${historico.map((c) => {
            const dif = Number(c.quantidade_contada) - Number(c.quantidade_anterior);
            const cls = dif === 0 ? "igual" : dif > 0 ? "sobra" : "falta";
            return `<li class="item"><span class="item__principal"><strong>${fmtDataHora(c.contado_em)}</strong>
              <small>${c.lotes?.validade ? `lote ${fmtData(c.lotes.validade)} · ` : ""}${esc(c.contado_por || "")}</small></span>
              <span class="item__lado diferenca diferenca--${cls}"><small>${fmtQtd(c.quantidade_anterior)} → <b>${fmtQtd(c.quantidade_contada)}</b></small>
              <em>${dif === 0 ? "confere" : (dif > 0 ? "+" : "") + fmtQtd(dif)}</em></span></li>`;
          }).join("")}</ul>`
        : `<div class="vazio"><p>Nenhuma contagem registrada.</p></div>`}
    </section>

    <button type="button" class="btn btn--perigo-texto btn--bloco" id="bExcluirProd">${icone("lixo")} Excluir produto</button>`;

  const form = $("#fProd");
  ligarChipsAlerta(form);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const erro = $(".erro-form", form);
    const m = validarProduto(form) || (!form.codigo_barras.value.trim() && "Informe o código.");
    if (m) { erro.textContent = m; erro.hidden = false; return; }
    try {
      await db.salvarProduto({
        id: p.id, codigo_barras: form.codigo_barras.value, nome: form.nome.value,
        unidade: form.unidade.value, categoria: form.categoria.value, dias_alerta: lerNumero(form.dias_alerta.value),
      });
      toast("Produto atualizado.");
      rotear();
    } catch (err) {
      erro.textContent = err.message;
      erro.hidden = false;
    }
  };
  $("#bExcluirProd").onclick = async () => {
    const okEx = await confirmar({ titulo: `Excluir ${p.nome}?`, texto: "O produto, todos os lotes e o histórico de contagens serão apagados. Esta ação não pode ser desfeita.", botao: "Excluir produto", perigo: true });
    if (!okEx) return;
    await db.excluirProduto(p.id);
    toast("Produto excluído.");
    location.hash = "#/estoque";
  };
}

iniciar();
